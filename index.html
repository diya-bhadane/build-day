<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timer</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="bg-gradient"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="particles" id="particles"></div>

    <canvas id="confetti"></canvas>

    <div class="container">
        <header class="header">
            <h1>Timer</h1>
            <p class="subtitle">Focus on what matters</p>
        </header>

        <main class="timer-card" id="timerCard">
            <div class="shimmer"></div>

            <div class="display-container">
                <div class="progress-ring-container">
                    <svg class="progress-ring" viewBox="0 0 200 200">
                        <defs>
                            <linearGradient id="progressGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#ff006e"/>
                                <stop offset="50%" style="stop-color:#8338ec"/>
                                <stop offset="100%" style="stop-color:#3a86ff"/>
                            </linearGradient>
                            <linearGradient id="successGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#06ffa5"/>
                                <stop offset="100%" style="stop-color:#ffbe0b"/>
                            </linearGradient>
                        </defs>
                        <circle class="progress-ring-bg" cx="100" cy="100" r="90"/>
                        <circle class="progress-ring-fill" id="progressRing" cx="100" cy="100" r="90"/>
                    </svg>
                </div>
                <div class="time-display" id="timeDisplay">
                    <span class="time-value" id="minutes">00</span>
                    <span class="time-separator">:</span>
                    <span class="time-value" id="seconds">00</span>
                </div>
            </div>

            <div class="input-section" id="inputSection">
                <label for="timerInput" class="input-label">Set Duration</label>
                <div class="input-wrapper">
                    <input
                        type="number"
                        id="timerInput"
                        class="timer-input"
                        placeholder="60"
                        min="1"
                        max="5999"
                        value="60"
                    >
                    <span class="input-suffix">seconds</span>
                </div>
            </div>

            <div class="controls">
                <button class="btn btn-primary" id="startBtn">
                    <span class="btn-text">Start</span>
                </button>
                <button class="btn btn-secondary" id="resetBtn" disabled>
                    <span class="btn-text">Reset</span>
                </button>
            </div>
        </main>

        <footer class="footer">
            <button class="notification-permission-btn" id="notificationBtn">
                <span class="notif-icon">🔔</span>
                <span class="notif-text" id="notifText">Enable Browser Notifications</span>
            </button>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
